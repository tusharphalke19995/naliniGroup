<svg width="320" height="90" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="elegantGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="elegantShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sophisticated Background Elements -->
  <g opacity="0.05">
    <circle cx="40" cy="40" r="25" fill="url(#elegantGradient)"/>
    <circle cx="240" cy="50" r="20" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Premium NUS Icon -->
  <g transform="translate(25, 25)" filter="url(#subtleGlow)">
    <!-- Sophisticated N Design -->
    <g transform="scale(1.3)">
      <!-- Main N with premium styling -->
      <path d="M4 4 L4 26 L7 26 L7 13 L18 26 L22 26 L22 4 L18 4 L18 17 L7 4 Z" fill="url(#elegantGradient)" stroke="url(#elegantGradient)" stroke-width="0.3"/>
      
      <!-- Elegant accent elements -->
      <circle cx="24" cy="8" r="2.5" fill="url(#accentGradient)" opacity="0.8"/>
      <rect x="22" y="20" width="5" height="5" fill="url(#accentGradient)" opacity="0.6" rx="1"/>
      <path d="M1 1 L5 1 L3 5 Z" fill="url(#elegantGradient)" opacity="0.5"/>
      
      <!-- Sophisticated connecting elements -->
      <line x1="26" y1="8" x2="28" y2="20" stroke="url(#elegantGradient)" stroke-width="1.5" opacity="0.4"/>
      <line x1="28" y1="20" x2="30" y2="8" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Premium Typography -->
  <g filter="url(#elegantShadow)">
    <text x="100" y="35" font-family="'Playfair Display', 'Georgia', serif" font-size="20" font-weight="700" fill="url(#textGradient)" letter-spacing="1px">
      NaliniUdyogSamuh
    </text>
  </g>
  
  <!-- Elegant Tagline -->
  <text x="100" y="55" font-family="'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="url(#elegantGradient)" letter-spacing="2px">
    PREMIUM TECHNOLOGY SOLUTIONS
  </text>
  
  <!-- Sophisticated Decorative Elements -->
  <g opacity="0.4">
    <line x1="100" y1="62" x2="290" y2="62" stroke="url(#elegantGradient)" stroke-width="2" opacity="0.3"/>
    <circle cx="295" cy="62" r="2" fill="url(#accentGradient)"/>
    <circle cx="300" cy="62" r="1.5" fill="url(#elegantGradient)" opacity="0.6"/>
  </g>
  
  <!-- Subtle Premium Pattern -->
  <g opacity="0.06">
    <rect x="220" y="20" width="6" height="6" fill="url(#elegantGradient)" rx="1"/>
    <rect x="230" y="25" width="4" height="4" fill="url(#accentGradient)" rx="1"/>
    <rect x="235" y="15" width="3" height="3" fill="url(#elegantGradient)" rx="1"/>
  </g>
</svg>
