<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Clean Background -->
  <rect width="80" height="80" rx="18" fill="url(#iconGradient)" opacity="0.05"/>
  <rect width="80" height="80" rx="18" fill="none" stroke="url(#iconGradient)" stroke-width="1" opacity="0.2"/>
  
  <!-- Minimalist N Icon -->
  <g transform="translate(24, 24)" filter="url(#iconShadow)">
    <g transform="scale(1.4)">
      <!-- Clean N -->
      <path d="M4 4 L4 24 L7 24 L7 12 L16 24 L19 24 L19 4 L16 4 L16 16 L7 4 Z" fill="url(#iconGradient)" stroke="url(#iconGradient)" stroke-width="0.3"/>
      
      <!-- Single accent -->
      <circle cx="18" cy="6" r="2.5" fill="url(#accentGradient)" opacity="0.8"/>
    </g>
  </g>
</svg>
